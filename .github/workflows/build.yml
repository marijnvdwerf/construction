name: Build fonts

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install project dependencies
        run: uv sync --locked

      - name: Build OTF fonts
        run: uv run fontmake -u src/*.ufo -o otf --output-dir build/otf --validate-ufo

      - name: Build TTF fonts
        run: uv run fontmake -u src/*.ufo -o ttf --output-dir build/ttf --validate-ufo

      - name: Check built fonts
        shell: bash
        run: |
          otf_count=$(find build/otf -type f -name '*.otf' | wc -l)
          ttf_count=$(find build/ttf -type f -name '*.ttf' | wc -l)
          test "$otf_count" -eq 4
          test "$ttf_count" -eq 4
          find build/otf build/ttf -type f \( -name '*.otf' -o -name '*.ttf' \) -print | sort

      - name: Upload fonts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: construction-fonts
          path: build/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '/') && github.ref_name != 'v'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built fonts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: construction-fonts
          path: build

      - name: Package release archive
        run: cd build && zip -r "../construction-fonts-${GITHUB_REF_NAME}.zip" otf ttf

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: construction-fonts-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
